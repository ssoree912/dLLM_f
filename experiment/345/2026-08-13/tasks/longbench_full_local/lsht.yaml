
tag:
  - longbench_fewshot_tasks
  - longbench_tasks
task: longbench_lsht
dataset_path: json
dataset_kwargs:
  data_files:
    test: /home/M2026107/dllm/data/longbench/lsht.jsonl
test_split: test
doc_to_text: "请判断给定新闻的类别，下面是一些例子。\n\n{{context}}\n{{question}}"
doc_to_target: '{{answers}}'
process_results: !function metrics.get_classification_with_score
generation_kwargs:
  max_gen_toks: 64
  temperature: 1
  do_sample: False
  until: ["\n"]
metric_list:
  - metric: "score"
    aggregation: mean
    higher_is_better: True
  - metric: "classification_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 5.0
