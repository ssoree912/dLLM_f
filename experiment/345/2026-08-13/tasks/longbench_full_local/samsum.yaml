
tag:
  - longbench_fewshot_tasks
  - longbench_tasks
task: longbench_samsum
dataset_path: json
dataset_kwargs:
  data_files:
    test: /home/M2026107/dllm/data/longbench/samsum.jsonl
test_split: test
doc_to_text: "Summarize the dialogue into a few short sentences. The following are some examples.\n\n{{context}}\n{{input}}"
doc_to_target: '{{answers}}'
target_delimiter: ""
process_results: !function metrics.get_rouge_with_score
generation_kwargs:
  max_gen_toks: 128
  temperature: 1
  do_sample: False
  until: ["\n"]
metric_list:
  - metric: "score"
    aggregation: mean
    higher_is_better: True
  - metric: "rouge_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 5.0
