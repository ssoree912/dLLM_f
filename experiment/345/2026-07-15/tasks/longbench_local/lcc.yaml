tag:
  - local_longbench_tasks
task: local_longbench_lcc
dataset_path: json
dataset_kwargs:
  data_files:
    test: /home/M2026107/dllm/data/longbench/lcc.jsonl
test_split: test
doc_to_text: "Please complete the code given below. \n{{context}}Next line of code:"
