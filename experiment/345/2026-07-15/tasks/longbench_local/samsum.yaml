tag:
  - longbench_fewshot_tasks
  - longbench_tasks
task: local_longbench_samsum
dataset_path: json
dataset_kwargs:
  data_files:
    test: /mnt/srv/home/dlpcg.325/dllm/data/longbench/samsum.jsonl
test_split: test
doc_to_text: "Summarize the dialogue into a few short sentences. The following are some examples.\n\n{{context}}\n{{input}}"
doc_to_target: "{{answers}}"
target_delimiter: ""
process_results: !function metrics.get_rouge_with_score
generation_kwargs:
  max_gen_toks: 128
  temperature: 1
  do_sample: false
  until: ["\n"]
metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true
  - metric: rouge_score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 5.0
